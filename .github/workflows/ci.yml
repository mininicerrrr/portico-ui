name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run docs:build
      - run: npm run docs:preview-smoke
      - name: Default vitepress preview base-path probe (expected limitation if assets 404)
        run: npm run docs:preview-vitepress-default
        continue-on-error: true
